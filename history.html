<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>cryptX — Threat History</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }
    .header {
      background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 20px; font-weight: bold; color: #00ff88; letter-spacing: 3px; }
    .logo span { color: #fff; }
    .header-sub { color: #333; font-size: 12px; }
    .header-right { display: flex; gap: 10px; }
    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }
    .btn-export { background: #00ff8822; color: #00ff88; border: 1px solid #00ff8844; }
    .btn-export:hover { background: #00ff8833; }
    .btn-clear { background: #ff444422; color: #ff4444; border: 1px solid #ff444444; }
    .btn-clear:hover { background: #ff444433; }
    
    

    

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
    }
    .stat {
      background: #0d0d0d;
      padding: 16px;
      text-align: center;
    }
    .stat-value { font-size: 28px; font-weight: bold; color: #00ff88; }
    .stat-label { font-size: 10px; color: #333; margin-top: 4px; letter-spacing: 1px; }

    .section { padding: 24px 28px; border-bottom: 1px solid #111; }
    .section-title {
      font-size: 11px;
      color: #333;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .threat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .threat-table th {
      background: #111;
      color: #333;
      padding: 10px 12px;
      text-align: left;
      font-size: 10px;
      letter-spacing: 1px;
      border-bottom: 1px solid #1a1a1a;
    }
    .threat-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #0f0f0f;
      color: #666;
    }
    .threat-table tr:hover td { background: #0d0d0d; }

    .badge {
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .badge.wasm   { background: #ff660022; color: #ff6600; border: 1px solid #ff660044; }
    .badge.cpu    { background: #ff444422; color: #ff4444; border: 1px solid #ff444444; }
    .badge.script { background: #cc00ff22; color: #cc00ff; border: 1px solid #cc00ff44; }

    .blocked-list { display: flex; flex-direction: column; gap: 8px; }
    .blocked-item {
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .blocked-domain { font-size: 13px; color: #fff; margin-bottom: 3px; }
    .blocked-meta { font-size: 11px; color: #333; }
    .btn-unblock {
      background: #ff444411;
      color: #ff4444;
      border: 1px solid #ff444433;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-unblock:hover { background: #ff444422; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #333;
      font-size: 13px;
      line-height: 1.8;
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="logo">crypt<span>X</span></div>
      <div class="header-sub">Threat History Dashboard</div>
    </div>
    <div class="header-right">
      
      <button class="btn btn-export" id="export-btn">⬇ Export CSV</button>
      <button class="btn btn-clear" id="clear-btn">🗑 Clear History</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="total-threats">0</div>
      <div class="stat-label">TOTAL THREATS</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-sites">0</div>
      <div class="stat-label">SITES DETECTED</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-blocked">0</div>
      <div class="stat-label">PERM BLOCKED</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-sessions">0</div>
      <div class="stat-label">ACTIVE DAYS</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">ALL DETECTED THREATS</div>
    <div id="history-container"></div>
  </div>

  <div class="section">
    <div class="section-title">PERMANENTLY BLOCKED SITES</div>
    <div id="blocked-container"></div>
  </div>

  
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
