<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>cryptX - Site Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 40px 30px;
      background: #0d0d0d;
      border: 1px solid #ff444433;
      border-radius: 16px;
      box-shadow: 0 0 60px #ff444411;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    .logo { font-size: 14px; font-weight: bold; color: #00ff88; letter-spacing: 3px; margin-bottom: 20px; }
    .logo span { color: #fff; }
    .title { font-size: 22px; font-weight: bold; color: #ff4444; margin-bottom: 10px; }
    .domain {
      font-size: 16px; color: #fff;
      background: #1a0000;
      border: 1px solid #ff444433;
      border-radius: 8px;
      padding: 10px 20px;
      margin: 16px 0;
      display: inline-block;
    }
    .reason { font-size: 12px; color: #555; margin-bottom: 24px; line-height: 1.8; }
    .btn {
      padding: 11px 24px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px;
    }
    .btn-back { background: #1a1a1a; color: #888; border: 1px solid #333; }
    .btn-back:hover { background: #222; color: #fff; }
    .btn-unblock { background: transparent; color: #ff4444; border: 1px solid #ff444444; }
    .btn-unblock:hover { background: #ff444411; }
    .footer { font-size: 10px; color: #222; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <div class="logo">crypt<span>X</span></div>
    <div class="title">This Site Has Been Blocked</div>
    <div class="domain" id="site-name">Loading...</div>
    <div class="reason">
      This site was permanently blocked by cryptX<br>
      because it was detected running cryptocurrency<br>
      mining scripts without your consent.
    </div>
    <div>
      <button class="btn btn-back" id="back-btn">← Go Back</button>
      <button class="btn btn-unblock" id="unblock-btn">🔓 Unblock This Site</button>
    </div>
    <div class="footer">cryptX — Behaviour-Based Cryptojacking Protection v1.0</div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
